<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(159 69)"><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><circle cx="-10" cy="5" r="2" fill="#53647e" stroke="none"/><circle cx="11" cy="5" r="2" fill="#53647e" stroke="none"/><path d="M-7 17q8 7 15 0" fill="none"/></g><path d="M139 106q20-10 40 0l8 62h-56z" fill="#8eadd5"/><path d="M84 167h191m-174 0v56m156-56v56" stroke="#bd9d7e" stroke-width="10"/><path d="m174 117 32 17 23 18m-88-31-13 26 11 11" fill="none" stroke="#d4a98c" stroke-width="10"/><path d="m183 153 64-9 16 22-65 10z" fill="#fffdf6" stroke="#b9c4cc"/><circle cx="226" cy="158" r="8" fill="#e5bf69" stroke="none"/><path d="m206 115 28 38" stroke="#d5a965" stroke-width="7"/><path d="m233 151 3 6" stroke="#6f7f91"/><path d="M85 138h22v28H85z" fill="#c1cfda"/><path d="m89 139-2-22m10 22 4-27" stroke="#bf91a4"/></g></svg>