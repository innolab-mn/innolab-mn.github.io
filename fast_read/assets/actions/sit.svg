<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M137 105h93v76h-93zm7 76v39m76-39v39" fill="#ddc6a5" stroke="#bca184"/><g transform="translate(150 79)"><path d="m-24-13-19 2 5 25 20-8m42-19 19 2-5 25-20-8" fill="#72594b"/><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><circle cx="-10" cy="5" r="2" fill="#53647e" stroke="none"/><circle cx="11" cy="5" r="2" fill="#53647e" stroke="none"/><path d="M-7 17q8 7 15 0" fill="none"/></g><path d="M133 115q17-8 34 0l13 53h-49z" fill="#b5a5d2"/><path d="m139 171 57 8v39m-33-45 53 3v42" stroke="#899bb3" stroke-width="11" fill="none"/><path d="M185 222h23m-3 0h23" stroke="#6d7c96" stroke-width="8"/><path d="m137 127 16 33 24 5m-14-40 13 27 14 7" stroke="#d4a98c" stroke-width="9" fill="none"/></g></svg>