<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(170 72)"><path d="m-24-13-19 2 5 25 20-8m42-19 19 2-5 25-20-8" fill="#72594b"/><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><path d="m-18 5 7-4 7 4m9 0 7-4 7 4" fill="none"/><path d="M-10 13h22q-1 20-11 20-11-1-11-20" fill="#b87878"/></g><path d="M149 112q20-10 42 0l7 60h-57z" fill="#b5a5d2"/><path d="m151 123-25-12-7-20m70 32 24-12 8-20" stroke="#d4a98c" stroke-width="10" fill="none"/><path d="m156 175-2 43m27-43 3 43" stroke="#8c9db5" stroke-width="13"/><path d="m104 56-10-8m8 28H86m148-20 10-8m-8 28h16" stroke="#d7b477" fill="none"/></g></svg>