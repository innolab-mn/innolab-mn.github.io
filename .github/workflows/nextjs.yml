name: Deploy Next.js Static to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [contenful-update]
  
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EVENT_DECORATION: ${{ vars.EVENT_DECORATION }}
      CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      CONTENTFUL_PREVIEW_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_PREVIEW_ACCESS_TOKEN }}
      CONTENTFUL_REVALIDATE_SECRET: ${{ secrets.CONTENTFUL_REVALIDATE_SECRET }}
      NEXT_PUBLIC_PREVIEW: ${{ secrets.NEXT_PUBLIC_PREVIEW }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_MEMBERSHIP_ENABLED: ${{ vars.NEXT_PUBLIC_MEMBERSHIP_ENABLED }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_CAPTCHA_ENABLED: ${{ vars.NEXT_PUBLIC_CAPTCHA_ENABLED }}
      NEXT_PUBLIC_SHOP_BANK_NAME: ${{ secrets.NEXT_PUBLIC_SHOP_BANK_NAME }}
      NEXT_PUBLIC_SHOP_BANK_ACCOUNT: ${{ secrets.NEXT_PUBLIC_SHOP_BANK_ACCOUNT }}
      NEXT_PUBLIC_SHOP_BANK_HOLDER: ${{ secrets.NEXT_PUBLIC_SHOP_BANK_HOLDER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: |
          npm run build

      - name: Synchronize shop prices from Contentful
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-shop-catalog.mjs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # Each deploy replaces the gh-pages branch; write CNAME so the custom domain survives.
          cname: innolab.mn
