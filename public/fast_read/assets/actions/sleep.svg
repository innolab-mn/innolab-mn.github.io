<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M77 134v83m226-83v83M77 193h226" stroke="#bc9d7b" stroke-width="10"/><rect x="81" y="129" width="220" height="64" rx="13" fill="#f7f2df"/><rect x="91" y="127" width="61" height="49" rx="14" fill="#fffdf7"/><g transform="translate(125 139)"><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><path d="m-15 3 8 2 7-2m8 0 8 2 7-2m-14 14h5" fill="none"/></g><path class="breathing" d="M153 137q58-22 140 11v43H153z" fill="#a4bddb"/><path d="M78 56q-30 0-21 22 7 14 25 5-12 20-28 4-17-21 7-30z" fill="#e2c67d" stroke="none"/></g></svg>