<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g class="still"><g transform="translate(170 69)"><path d="m-24-13-19 2 5 25 20-8m42-19 19 2-5 25-20-8" fill="#72594b"/><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><circle cx="-10" cy="5" r="2" fill="#53647e" stroke="none"/><circle cx="11" cy="5" r="2" fill="#53647e" stroke="none"/><path d="M-7 17q8 7 15 0" fill="none"/></g><path d="M153 105q17-9 34 0l5 57h-44z" fill="#b5a5d2"/><g fill="none" stroke="#d5a98c" stroke-width="10"><path d="m157 112-17 42m43-42 19 42"/></g><g fill="none" stroke="#7f91ab" stroke-width="12"><path d="m164 159-17 53m30-53 20 53"/></g><path d="M134 216h22m32 0h23" stroke="#667a96" stroke-width="9"/></g><g class="ball-bounce"><circle cx="255" cy="150" r="31" fill="#f7f8ef"/><path d="m255 134 14 10-6 16h-17l-6-16zm-30 8 15 2m6 16-9 13m26-13 10 13m-4-29 15-2m-29-8v-14" fill="#8eabc1"/></g><path d="M220 214h70" stroke="#c2d0b9"/></g></svg>