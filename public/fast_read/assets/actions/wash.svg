<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(159 69)"><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><circle cx="-10" cy="5" r="2" fill="#53647e" stroke="none"/><circle cx="11" cy="5" r="2" fill="#53647e" stroke="none"/><path d="M-7 17q8 7 15 0" fill="none"/></g><path d="M139 106q20-10 40 0l8 62h-56z" fill="#8eadd5"/><path d="m144 124 36 22 19-3m-19-19 26 22 11-5" stroke="#d4a98c" stroke-width="10" fill="none"/><path d="M132 163h166v26H132z" fill="#c5dce7"/><ellipse cx="215" cy="161" rx="64" ry="18" fill="#e9f1f4"/><path d="M267 151V93q0-17-17-17h-19v16h15" fill="none" stroke="#9baebc" stroke-width="9"/><path class="water-flow" d="M235 97v29m11-29v29" stroke="#9ecfdf" stroke-width="4" stroke-dasharray="4 7"/><circle cx="206" cy="131" r="7" fill="#e8f7fb"/><circle cx="190" cy="137" r="5" fill="#e8f7fb"/><path d="m153 190-2 29m26-29 2 29" stroke="#8c9db5" stroke-width="13"/></g></svg>