<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260"><style>.walking{transform-origin:170px 210px;animation:walk 1.3s ease-in-out infinite}.running{transform-origin:170px 210px;animation:run .45s ease-in-out infinite}.jumping{animation:jump 1.6s ease-in-out infinite}.breathing{transform-origin:150px 190px;animation:breathe 3s ease-in-out infinite}.ball-bounce{animation:ball 1.3s ease-in-out infinite}.water-flow{animation:water .7s linear infinite}@keyframes walk{50%{transform:rotate(3deg) translateY(-3px)}}@keyframes run{50%{transform:rotate(8deg) translateY(-9px)}}@keyframes jump{45%{transform:translateY(-24px)}}@keyframes breathe{50%{transform:scaleY(1.05)}}@keyframes ball{50%{transform:translateY(-28px)}}@keyframes water{to{stroke-dashoffset:-22}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="180" cy="126" r="111" fill="#eef3e9"/><ellipse cx="180" cy="226" rx="125" ry="11" fill="#dae4d4"/><g stroke="#53647e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(159 69)"><circle r="29" fill="#ffd8b8"/><path d="M-29-2v-14q3-28 30-22 29-3 29 25l-9-10q-19 15-41 5z" fill="#71594b"/><circle cx="-10" cy="5" r="2" fill="#53647e" stroke="none"/><circle cx="11" cy="5" r="2" fill="#53647e" stroke="none"/><path d="M-7 17q8 7 15 0" fill="none"/></g><path d="M139 106q20-10 40 0l8 62h-56z" fill="#8eadd5"/><path d="m140 120-18 27 25 18m31-45 25-11-4-20" stroke="#d4a98c" stroke-width="10" fill="none"/><g class="cup"><path d="m183 92 4 42h31l5-42z" fill="#cee7ef"/><path d="M187 108h32m-30 8h28" stroke="#a3cadc"/><path d="m199 98-19-16" stroke="#b7a885"/></g><path d="m151 168-2 49m24-49 4 49" stroke="#8c9db5" stroke-width="13"/></g></svg>